<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="4" y="6" width="16" height="20" rx="2" fill="#3F3F46" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="12" y="6" width="16" height="20" rx="2" fill="#27272A" stroke="#EF4444" stroke-width="1.5"/>
  </g>
</svg>
